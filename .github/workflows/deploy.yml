name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest   # x86_64, matches the server (build.sh defaults to linux/amd64)
    # Each value may be set as an Actions variable or a secret.
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
      APP_PORT: ${{ vars.APP_PORT || secrets.APP_PORT }}
    steps:
      - name: Check deploy settings
        run: |
          for v in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_PATH APP_PORT; do
            [ -n "${!v}" ] || { echo "::error::$v is not set (add it under Settings > Secrets and variables > Actions)"; exit 1; }
          done
          echo "SSH_TARGET=$DEPLOY_USER@$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "SSH_OPTS=-i $HOME/.ssh/deploy_key -p $DEPLOY_PORT" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.20.0 --activate

      - name: Test
        run: |
          (cd backend && pnpm install --frozen-lockfile && pnpm typecheck && pnpm test)
          (cd web && pnpm install --frozen-lockfile && pnpm test)

      - name: Build
        run: ./build.sh

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Upload dist
        run: rsync -a --delete -e "ssh $SSH_OPTS" dist/ "$SSH_TARGET:$DEPLOY_PATH/dist/"

      - name: Restart backend and check health
        run: |
          ssh $SSH_OPTS "$SSH_TARGET" \
            "cd '$DEPLOY_PATH' && docker compose restart backend && sleep 5 && curl -fsS localhost:$APP_PORT/health"
